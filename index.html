['Stand up and do a ten second victory dance on the spot','Sing the chorus of a song at normal volume for five seconds','Stand up, salute the room, and say “carry on”','Do a proper runway walk across the room and back','Laugh-cry for five seconds, wipe your eyes, and say “sorry, remembered something”']];

['Tap the desk three times like a secret code','Blink slowly at the nearest person for five seconds','Check an invisible watch, then nod like you’re late','Adjust an invisible tie with great dignity','Look up like you heard a noise, then shrug'],
['Turn your head in slow motion to look at your neighbour','Give someone a very serious thumbs up and say nothing','Say “bless you” to someone who didn’t sneeze','Wave at someone across the room like they’re miles away','Whisper “plot twist” and carry on like nothing happened'],
['Read out the time in your best news anchor voice','Catch an invisible fly, inspect it, then set it free','Narrate what the person opposite is doing like a nature documentary','Walk across the room in slow motion','Introduce yourself to the room like a game show host'],

const WL=[['Dog','Eating spaghetti','Sleeping','Swimming','Brushing teeth','Cat'],
['Riding a bike','Elephant','Playing guitar','Taking a selfie','Penguin','Sneezing'],
['Teacher','Surfing','Skateboarding','Making a sandwich','Gorilla','Fishing'],
['Astronaut','Pirate','Walking a tightrope','Vampire','Walking a dog in the rain','Superhero landing'],
['A cowboy who lost his horse','Baking a cake that explodes','A snowman melting','Playing the drums','Opening a very stuck jar','A dinosaur on roller skates'],
['A waiter dropping a full tray','A ghost haunting a library','Parachuting into a swimming pool','Being chased by a bear','A chicken crossing the road','A pirate who found no treasure'],
['A mime stuck in a lift','A chef who can’t find the salt','Petting a cat that hates you','Getting a haircut you hate','A robot learning to dance','A detective solving the case of the missing cookie'],
['Finding Nemo','Jaws','Ghostbusters','Toy Story','The Lion King','Mission Impossible']];
const GM=[['dp','🎨','Doodle Chain','Write something, draw it, guess it, pass it on. Gartic Phone style.'],['ml','👆','Most Likely To','Vote on who fits the prompt. You see who voted for who.'],['im','🕵️','Imposter','Same secret word for everyone except one bluffer. Send one-word clues, then vote them out.'],['qb','😂','Quip Battle','Everyone answers a daft prompt, then votes for the funniest.'],['sd','🥷','Dare Duty','One person at a time. Camera goes live on your turn, everyone judges. 8 levels, up to Mythic.'],['ch','🎭','Live Charades','Act a secret word on live camera, no talking. Everyone else types guesses. Gets harder every round.'],['pp','🎡','Punishment Roulette','Everyone writes punishments. Quick contests find the loser, who does a random one on live camera.'],['sf','🗿','Stone Face','Keep a straight face on live camera while the class types and draws their own ridiculous stuff onto your screen. Spot the crack to score. Silent, so it works in class.']];
let L={};try{L=JSON.parse(localStorage.hop)||{}}catch(e){}
let me=L.n?{n:L.n,e:L.e}:null,tmp={n:L.n||'',e:L.e||EM[0]},peer,conns={},host=false,hc,id,S={p:[]},T=null,W=null,B=[],IM={},OR=[],SP=[],LS=null,VS=null,CALLED={},CALLS=[],seen={},HT=0,U={},PV={},GEN=0,RT=0,tries=0,last=0,room='',rcn=0,q=[],cs=-1,cd=-1,uid=(()=>{try{return sessionStorage.hopuid||(sessionStorage.hopuid='u'+Math.random().toString(36).slice(2,10))}catch(e){return'u'+Math.random().toString(36).slice(2,10)}})(),shown=-1,qs=-1,qd=-1,myA='',QA={},QO=[],QPool=[],err='',col=COL[0];
let CT=-1,CERR='',CW='',CP=[],GK=-1,PP=[],SUBS={},CS={t:-1},PPT=0,PQ=[],SFT=0,SFA={},SFV={t:-1,at:0},SFN='',SFDW=-1;
const R0=(()=>{try{return sessionStorage.hoproom||''}catch(e){return''}})();
const Q0=(new URLSearchParams(location.search).get('room')||'').slice(0,4);
const N=()=>S.p.length,pName=i=>{const p=S.p.find(p=>p.id===i);return p?p.e+' '+esc(p.n):'?'};
const chip=p=>`<span class=pl><span class=av>${p.e}</span>${esc(p.n)}${p.z?' 💤':''}</span>`;
const tal=()=>{const c={};Object.values(S.v||{}).forEach(t=>c[t]=(c[t]||0)+1);return c};

/* ---------- networking: host-authoritative over WebRTC (PeerJS free broker) ---------- */
const PID=c=>'hopin-party-'+c,rc=()=>[...Array(4)].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
function bcast(){for(const k in conns)conns[k].open&&conns[k].send({t:'S',s:S});render()}
function send(to,m){if(to!==id&&(m.t==='task'||m.t==='word'))(PV[to]=PV[to]||{})[m.t]=m;to===id?recv(m):conns[to]&&conns[to].open&&conns[to].send(m)}
function act(m){host?handle(id,m):hc&&hc.open?hc.send(m):q.push(m)}
function recv(m){
 if(m.t==='hb')return;
 if(m.t==='x')return fail('That game’s already running. Wait for the next one.');
 if(m.t==='S'){S=m.s;if(S.g!=='dp')T=null;if(!S.g)W=null;if(S.g!=='qb')qd=-1;if(S.g!=='im')cd=-1;if(S.g==='qb'&&S.ph==='ans'&&qd!==S.r)myA=''}
 else{if(m.t==='task')T=m;if(m.t==='word')W=m}
 render();
}
function fail(m){err=m;GEN++;clearInterval(HT);clearTimeout(RT);RT=0;rcn=0;room='';try{sessionStorage.removeItem('hoproom')}catch(e){}try{peer.destroy()}catch(e){}peer=null;hc=null;conns={};host=false;S={p:[]};T=W=null;shown=-1;qs=qd=cs=cd=-1;render()}
const H0=f=>f===id;
function ensureHost(){if(me&&!S.p.some(p=>p.id===id))S.p.unshift({id,n:me.n,e:me.e,s:0,sk:2,st:0,pi:id})}
function drop(i){try{conns[i]&&conns[i].close()}catch(e){}delete conns[i];if(!S.p.some(p=>p.id===i))return;S.p=S.p.filter(p=>p.id!==i);
 if(S.g==='pp'&&N()>=3){delete SUBS[i];delete S.v[i];if(S.pd)delete S.pd[i];if(S.who===i&&(S.ph==='pun'||S.ph==='res'))return ppAfter();if(S.ph==='play'){if(S.p.every(p=>p.id in SUBS))return ppResolve();return bcast()}if(S.ph==='pun')return ppVoteCheck();return bcast()}
 if(S.g==='ch'&&N()>=3){OR=OR.filter(x=>x!==i);if(S.who!==i)return bcast();if(S.t>=S.T)S.ph='end';else chNext();return bcast()}
 if(S.g==='sf'&&N()>=3){OR=OR.filter(x=>x!==i);if(S.cr)delete S.cr[i];if(S.am)delete S.am[i];if(S.who!==i)return sfCheck();clearTimeout(SFT);if(S.t>=S.T)S.ph='end';else sfNext();return bcast()}
 if(S.g==='sd'&&N()>=3){OR=OR.filter(x=>x!==i);delete S.v[i];if(S.who!==i)return sdCheck();if(S.t>=S.T)S.ph='end';else sdNext();return bcast()}
 if(S.g){S.g=null;S.ph='lobby';ensureHost()}bcast()}
const wake=()=>{try{navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;wake();if(host&&peer&&peer.disconnected)try{peer.reconnect()}catch(e){}if(!host&&room){if(!hc||!hc.open){clearTimeout(RT);RT=0;link()}else hc.send({t:'hb'})}});
function startHost(){
 wake();const code=rc();host=true;peer=new Peer(PID(code));peer.on('call',onCall);
 peer.on('open',i=>{id=i;S={g:null,ph:'lobby',c:code,cam:1,p:[{id,n:me.n,e:me.e,s:0,sk:2,st:0,pi:id}]};render();HT=setInterval(()=>{const t=Date.now();let ch=0;for(const k in conns)conns[k].open&&conns[k].send({t:'hb'});S.p.forEach(p=>{if(p.id===id)return;const idle=t-(seen[p.id]||t),z=idle>10000?1:0;if((p.z||0)!==z){p.z=z;ch=1}if(idle>120000)drop(p.id)});if(ch)bcast()},4000)});
 peer.on('connection',c=>c.on('data',m=>{if(m.t==='join'){U[c.peer]=m.u?String(m.u).slice(0,24):c.peer;conns[U[c.peer]]=c;m.pi=c.peer}const f=U[c.peer];if(f)handle(f,m)}));
 peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();startHost()}else fail('Connection dropped ('+e.type+'). Try again.')});
}
function join(c){room=c.toUpperCase();tries=0;wake();link()}
function link(){
 const g=++GEN;clearInterval(HT);try{peer&&peer.destroy()}catch(e){}
 peer=new Peer();peer.on('call',onCall);
 peer.on('open',()=>{if(g!==GEN)return;id=uid;hc=peer.connect(PID(room),{reliable:true});
  hc.on('open',()=>{if(g!==GEN)return;tries=0;rcn=0;last=Date.now();hc.send({t:'join',n:me.n,e:me.e,u:uid});while(q.length)hc.send(q.shift());HT=setInterval(()=>{hc.open&&hc.send({t:'hb'});if(!document.hidden&&Date.now()-last>15000)reco()},3000);try{sessionStorage.hoproom=room}catch(e){}if(S.p.length)render()});
  hc.on('data',m=>{if(g===GEN){last=Date.now();recv(m)}});
  hc.on('close',()=>{if(g===GEN)reco()})});
 peer.on('error',e=>{if(g!==GEN)return;if(!S.p.length)fail(e.type==='peer-unavailable'?'Can’t find that room. Check the code.':'Connection dropped ('+e.type+'). Try again.');else reco()});
}
function reco(){if(host||RT||!room)return;rcn=1;render();RT=setTimeout(()=>{RT=0;if(++tries>20)return fail('Lost the connection. Try joining again.');link()},2500)}

/* ---------- host game logic ---------- */
function handle(f,m){
 seen[f]=Date.now();
 if(m.t==='hb')return;
 if(H0(f)&&m.t==='kick'&&m.i!==f)return drop(m.i);
 if(H0(f)&&m.t==='camset'){S.cam=S.cam?0:1;if(!S.cam)S.live=0;return bcast()}
 if(m.t==='join'){const q0=S.p.find(p=>p.id===f);if(q0){q0.pi=m.pi;Object.values(PV[f]||{}).forEach(x=>send(f,x));return bcast()}if(S.g&&S.g!=='sd'&&S.g!=='ch'&&S.g!=='pp'&&S.g!=='sf')return send(f,{t:'x'});if(!S.p.some(p=>p.id===f)){S.p.push({id:f,n:String(m.n).slice(0,12),e:EM.includes(m.e)?m.e:'🙂',s:0,sk:2,st:0,pi:m.pi});if(S.g==='sd'||S.g==='ch'||S.g==='sf')OR.push(f);if(S.g==='sf'&&S.am)S.am[f]=3}return bcast()}
 const G=S.g,H=f===id;
 if(H&&m.t==='go'&&!G&&N()>=3)return start(m.g);
 if(H&&m.t==='home'){clearTimeout(SFT);ensureHost();S.g=null;S.ph='lobby';return bcast()}
 if(G==='dp'){
  const k=S.p.findIndex(p=>p.id===f);
  if(m.t==='sub'&&S.ph==='play'&&m.r===S.r&&!S.done[f]){
   const im=S.r%2===1,v=im?(String(m.v).startsWith('data:image/jpeg;base64,')?String(m.v):''):String(m.v).slice(0,80);
   B[(k+S.r)%N()].push({by:f,k:im?'i':'t',v});S.done[f]=1;return Object.keys(S.done).length>=N()?dpAdv():bcast()}
  if(H&&m.t==='skip'&&S.ph==='play'){S.p.forEach((p,i)=>{if(!S.done[p.id]){B[(i+S.r)%N()].push({by:p.id,k:S.r%2?'i':'t',v:''});S.done[p.id]=1}});return dpAdv()}
  if(H&&m.t==='nx'&&S.ph==='rev'){if(S.j<S.books[S.i].length)S.j++;else if(++S.i>=N()){S.g=null;S.ph='lobby'}else S.j=1;return bcast()}
 }
 if(m.t==='vote'&&S.ph==='vote'&&!S.v[f]&&S.p.some(p=>p.id===m.to)){S.v[f]=m.to;return Object.keys(S.v).length>=N()?(G==='ml'?mlRes():imRes()):bcast()}
 if(G==='qb'){
  if(m.t==='qa'&&S.ph==='ans'&&!S.dn.includes(f)){QA[f]=String(m.v).slice(0,60)||'(blank)';S.dn.push(f);return S.dn.length>=N()?qVote():bcast()}
  if(m.t==='qv'&&S.ph==='vote'&&!(f in S.v)&&QO[m.o]&&QO[m.o].by!==f){S.v[f]=m.o;return Object.keys(S.v).length>=N()?qRes():bcast()}
  if(H&&m.t==='skip'&&S.ph==='ans'){S.p.forEach(p=>{if(!S.dn.includes(p.id)){QA[p.id]='(no answer)';S.dn.push(p.id)}});return qVote()}
  if(H&&m.t==='nx'&&S.ph==='res'){if(S.r>=4){S.g=null;S.ph='lobby'}else qNext();return bcast()}
 }
 if(G==='pp'){
  const pl=S.p.some(p=>p.id===f);
  if(S.ph==='mk'){
   if(pl&&m.t==='xa'){const t=String(m.v).trim().slice(0,80);if(!t||(S.pd[f]||0)>=3||PP.some(x=>x.t.toLowerCase()===t.toLowerCase()))return;PP.push({t,by:f,u:0});S.pn=PP.length;S.pd[f]=(S.pd[f]||0)+1;return bcast()}
   if(H&&m.t==='xr'){const x=PP.splice(+m.i,1)[0];if(x&&x.by)S.pd[x.by]=Math.max(0,(S.pd[x.by]||1)-1);S.pn=PP.length;return bcast()}
   if(H&&m.t==='xgo')return ppGo();
  }
  if(S.ph==='play'){
   if(pl&&m.t==='xs'&&m.r===S.t&&!(f in SUBS)){SUBS[f]=Math.max(0,Math.min(99999,Number(m.v)||0));return ppCheck()}
   if(H&&m.t==='ev')return ppResolve();
  }
  if(S.ph==='pun'){
   const w=f===S.who;
   if(w&&S.cam&&m.t==='live'){S.live=m.on?1:0;return bcast()}
   if(w&&m.t==='xg'){const a=S.p.find(p=>p.id===S.who);if(a)a.s-=1;S.out={ok:false,gu:1};S.ph='res';S.live=0;return bcast()}
   if(!w&&pl&&m.t==='xv'){S.v[f]=m.y?1:0;return ppVoteCheck()}
   if(H&&m.t==='ev')return ppJudge();
  }
  if(H&&m.t==='nx'&&S.ph==='res')return ppAfter();
  if(H&&m.t==='fin'){S.ph='end';S.live=0;return bcast()}
 }
 if(G==='ch'){
  const w=f===S.who,go=S.ph==='go';
  if(w&&go&&S.cam&&m.t==='live'){S.live=m.on?1:0;return bcast()}
  if(w&&go&&m.t==='gu')return chFin(0,'gaveup');
