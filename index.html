<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hop In - party games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#151515;--sun:#ffd93b;--pink:#ff4d94;--blue:#2c4bff;--mint:#5ee6b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--sun);color:var(--ink);font:500 17px/1.35 system-ui,-apple-system,sans-serif;min-height:100vh}
#app{max-width:480px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px 48px}
h1,h2,h3{font-family:'Bagel Fat One',system-ui,sans-serif;font-weight:400;margin:.25em 0;line-height:1.05}
h1{font-size:56px;transform:rotate(-3deg);margin:.2em 0 .1em}
h2{font-size:30px}h3{font-size:22px}
.card{background:#fff;border:3px solid var(--ink);border-radius:14px 22px 12px 20px;box-shadow:6px 6px 0 var(--ink);padding:16px;margin:18px 0}
button,input{font:inherit;color:inherit}
button{display:block;border:3px solid var(--ink);background:#fff;border-radius:12px;padding:12px 14px;font-weight:800;box-shadow:4px 4px 0 var(--ink);cursor:pointer;width:100%;margin:10px 0;text-align:left}
button:active{transform:translate(4px,4px);box-shadow:0 0}
button.r{background:var(--pink)}button.t{background:var(--blue);color:#fff}
button[disabled]{opacity:.45;box-shadow:none}
input{width:100%;border:3px solid var(--ink);border-radius:10px;padding:12px;background:#fff;margin:6px 0}
.row{display:flex;gap:6px;flex-wrap:wrap}
.e{width:auto;flex:1 0 17%;font-size:26px;padding:6px;margin:0;text-align:center;box-shadow:2px 2px 0 var(--ink)}
.e.on{background:var(--pink)}
.pl{display:inline-flex;align-items:center;gap:6px;background:var(--mint);border:2px solid var(--ink);border-radius:30px;padding:3px 12px 3px 6px;margin:3px;font-weight:800}
.av{font-size:24px}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px;font-size:14px;font-weight:800;transform:rotate(-2deg)}
canvas{width:100%;aspect-ratio:1;background:#fff;border:3px solid var(--ink);border-radius:10px;touch-action:none;display:block}
.sw{display:flex;gap:8px;margin:10px 0}.sw b{flex:1;height:38px;border:3px solid var(--ink);border-radius:8px;cursor:pointer}
.big{font-family:'Bagel Fat One',system-ui;font-size:64px;letter-spacing:8px;text-align:center;line-height:1}
img.d{width:100%;border:3px solid var(--ink);border-radius:10px;display:block}
.bar{height:20px;background:var(--blue);border:2px solid var(--ink);border-radius:6px;margin:6px 0}
small{opacity:.75}
</style></head><body><div id=app></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EM=['🦊','🐙','🐸','🦄','🐧','🐯','🦖','🐝','🐳','🦉'],COL=['#151515','#ff4d94','#2c4bff','#1fb36f','#ffd93b','#fff'];
const Q=['get lost in their own town','cry at a pet food advert','survive a zombie apocalypse','reply to a text three days late','become famous','eat food off the floor','fall asleep at a party','set the kitchen on fire','win a hot dog eating contest','forget their own birthday','adopt ten cats','be late to their own wedding','get a tattoo on a dare','cheat at board games','go viral for something embarrassing','talk to a stranger for two hours'];
const WD=['Pizza','Beach','Dragon','Library','Rollercoaster','Penguin','Pirate','Volcano','Birthday','Spaceship','Camping','Karaoke','Snowman','Dentist','Circus','Wedding'];
const QP=['A terrible name for a pet goldfish','A bad slogan for a dentist','Something you should not bring to a first date','The real reason the dinosaurs went extinct','A rejected ice cream flavour','What your dog is really thinking','The worst superpower','Title of your autobiography','Something you would find in a haunted fridge','The worst thing to hear from your pilot','A new Olympic sport','A terrible theme for a wedding'];
const LV=['Tiny','Small','Spicy','Bold','Wild','Extreme'];
const SD=[['Cough twice, loud enough that people hear','Sigh like you just got homework','Do the biggest yawn you can','Drop your pencil, then take ages to pick it up','Say “right then” out loud to nobody'],
['Stand up, look around, sit back down','Fake a sneeze, then say “excuse me” very formally','Say “fascinating” out loud after the teacher talks','Drum on your desk for five seconds','Stare out the window and sigh like you’re in a film'],
['Stand up, stretch, and say “much better”','Hum a tune until someone looks at you','Ask the teacher to repeat that, then say “very helpful, thanks”','Put your coat on, then take it off again','Nod and quietly clap once like something good just happened'],
['Say “good point” out loud after the teacher says something','Stand behind your chair for ten seconds like you’re guarding it','Tidy your whole desk like it’s the most important job ever','Put your hand up and ask something that starts with “Hypothetically…”','Hold your pen like a mic and say “testing, one two”'],
['Stand up and give a ten second speech about your favourite biscuit','Whisper-sing the first line of any song so a neighbour hears','Say “I have an announcement”, wait for people to look, then say “it’s nothing, carry on”','Walk the long way round the room like a spy, then sit down','Stand, bow to the whole room, then sit back down'],
['Stand up and do a ten second victory dance on the spot','Sing the chorus of a song at normal volume for five seconds','Stand up, salute the room, and say “carry on”','Do a proper runway walk across the room and back','Laugh-cry for five seconds, wipe your eyes, and say “sorry, remembered something”']];
const GM=[['dp','🎨','Doodle Chain','Write something, draw it, guess it, pass it on. Gartic Phone style.'],['ml','👆','Most Likely To','Vote on who fits the prompt. You see who voted for who.'],['im','🕵️','Imposter','Everyone gets a secret word except one person. Same room only.'],['qb','😂','Quip Battle','Everyone answers a daft prompt, then votes for the funniest.'],['sd','🥷','Dare Duty','One person at a time. Everyone sees the dare and judges it. Same room only.']];
let L={};try{L=JSON.parse(localStorage.hop)||{}}catch(e){}
let me=L.n?{n:L.n,e:L.e}:null,tmp={n:L.n||'',e:L.e||EM[0]},peer,conns={},host=false,hc,id,S={p:[]},T=null,W=null,B=[],IM={},OR=[],SP=[],shown=-1,qs=-1,qd=-1,myA='',QA={},QO=[],QPool=[],err='',col=COL[0];
const Q0=(new URLSearchParams(location.search).get('room')||'').slice(0,4);
const N=()=>S.p.length,pName=i=>{const p=S.p.find(p=>p.id===i);return p?p.e+' '+esc(p.n):'?'};
const chip=p=>`<span class=pl><span class=av>${p.e}</span>${esc(p.n)}</span>`;
const tal=()=>{const c={};Object.values(S.v||{}).forEach(t=>c[t]=(c[t]||0)+1);return c};

/* ---------- networking: host-authoritative over WebRTC (PeerJS free broker) ---------- */
const PID=c=>'hopin-party-'+c,rc=()=>[...Array(4)].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
function bcast(){for(const k in conns)conns[k].open&&conns[k].send({t:'S',s:S});render()}
function send(to,m){to===id?recv(m):conns[to]&&conns[to].open&&conns[to].send(m)}
function act(m){host?handle(id,m):hc.send(m)}
function recv(m){
 if(m.t==='x')return fail('That game’s already running. Wait for the next one.');
 if(m.t==='S'){S=m.s;if(S.g!=='dp')T=null;if(!S.g)W=null;if(S.g!=='qb')qd=-1;if(S.g==='qb'&&S.ph==='ans'&&qd!==S.r)myA=''}
 else{if(m.t==='task')T=m;if(m.t==='word')W=m}
 render();
}
function fail(m){err=m;try{peer.destroy()}catch(e){}peer=null;conns={};host=false;S={p:[]};T=W=null;shown=-1;qs=qd=-1;render()}
function startHost(){
 const code=rc();host=true;peer=new Peer(PID(code));
 peer.on('open',i=>{id=i;S={g:null,ph:'lobby',c:code,p:[{id,n:me.n,e:me.e,s:0}]};render(1)});
 peer.on('connection',c=>{conns[c.peer]=c;c.on('data',m=>handle(c.peer,m));c.on('close',()=>{delete conns[c.peer];S.p=S.p.filter(p=>p.id!==c.peer);if(S.g){S.g=null;S.ph='lobby'}bcast()})});
 peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();startHost()}else fail('Connection dropped ('+e.type+'). Try again.')});
}
function join(c){
 peer=new Peer();
 peer.on('open',i=>{id=i;hc=peer.connect(PID(c.toUpperCase()),{reliable:true});hc.on('open',()=>hc.send({t:'join',n:me.n,e:me.e}));hc.on('data',recv);hc.on('close',()=>fail('The host left, so the room’s closed.'))});
 peer.on('error',e=>fail(e.type==='peer-unavailable'?'Can’t find that room. Check the code.':'Connection dropped ('+e.type+'). Try again.'));
}

/* ---------- host game logic ---------- */
function handle(f,m){
 if(m.t==='join'){if(S.g)return send(f,{t:'x'});if(!S.p.some(p=>p.id===f))S.p.push({id:f,n:String(m.n).slice(0,12),e:EM.includes(m.e)?m.e:'🙂',s:0});return bcast()}
 const G=S.g,H=f===id;
 if(H&&m.t==='go'&&!G&&N()>=3)return start(m.g);
 if(H&&m.t==='home'){S.g=null;S.ph='lobby';return bcast()}
 if(G==='dp'){
  const k=S.p.findIndex(p=>p.id===f);
  if(m.t==='sub'&&S.ph==='play'&&m.r===S.r&&!S.done[f]){
   const im=S.r%2===1,v=im?(String(m.v).startsWith('data:image/jpeg;base64,')?String(m.v):''):String(m.v).slice(0,80);
   B[(k+S.r)%N()].push({by:f,k:im?'i':'t',v});S.done[f]=1;return Object.keys(S.done).length>=N()?dpAdv():bcast()}
  if(H&&m.t==='skip'&&S.ph==='play'){S.p.forEach((p,i)=>{if(!S.done[p.id]){B[(i+S.r)%N()].push({by:p.id,k:S.r%2?'i':'t',v:''});S.done[p.id]=1}});return dpAdv()}
  if(H&&m.t==='nx'&&S.ph==='rev'){if(S.j<S.books[S.i].length)S.j++;else if(++S.i>=N()){S.g=null;S.ph='lobby'}else S.j=1;return bcast()}
 }
 if(m.t==='vote'&&S.ph==='vote'&&!S.v[f]&&S.p.some(p=>p.id===m.to)){S.v[f]=m.to;return Object.keys(S.v).length>=N()?(G==='ml'?mlRes():imRes()):bcast()}
 if(G==='qb'){
  if(m.t==='qa'&&S.ph==='ans'&&!S.dn.includes(f)){QA[f]=String(m.v).slice(0,60)||'(blank)';S.dn.push(f);return S.dn.length>=N()?qVote():bcast()}
  if(m.t==='qv'&&S.ph==='vote'&&!(f in S.v)&&QO[m.o]&&QO[m.o].by!==f){S.v[f]=m.o;return Object.keys(S.v).length>=N()?qRes():bcast()}
  if(H&&m.t==='skip'&&S.ph==='ans'){S.p.forEach(p=>{if(!S.dn.includes(p.id)){QA[p.id]='(no answer)';S.dn.push(p.id)}});return qVote()}
  if(H&&m.t==='nx'&&S.ph==='res'){if(S.r>=4){S.g=null;S.ph='lobby'}else qNext();return bcast()}
 }
 if(G==='sd'){
  if(f===S.who&&S.ph==='go'&&m.t==='sdd'){S.ph='vote';S.v={};return bcast()}
  if(f===S.who&&S.ph==='go'&&m.t==='sdc')return sdFin(0,'chicken');
  if(H&&m.t==='ev'){if(S.ph==='go')return sdFin(0,'time');if(S.ph==='vote')return sdVote()}
  if(m.t==='sv'&&S.ph==='vote'&&f!==S.who&&!(f in S.v)){S.v[f]=m.y?1:0;return Object.keys(S.v).length>=N()-1?sdVote():bcast()}
  if(H&&m.t==='nx'&&S.ph==='res'){if(S.t>=S.T)S.ph='end';else sdNext();return bcast()}
 }
 if(H&&G==='ml'&&m.t==='nx'){if(S.r>=6){S.g=null;S.ph='lobby'}else mlNext();return bcast()}
 if(H&&G==='im'){if(m.t==='tv'){S.ph='vote';S.v={}}if(m.t==='nx')imNew();return bcast()}
}
function start(g){S.g=g;S.v={};
 if(g==='dp'){B=S.p.map(()=>[]);S.r=0;S.ph='play';dpTasks()}
 if(g==='ml'){S.r=0;mlNext()}
 if(g==='im')imNew();
 if(g==='sd'){S.p.forEach(p=>p.s=0);OR=S.p.map(p=>p.id).sort(()=>Math.random()-.5);SP=SD.map(a=>[...a].sort(()=>Math.random()-.5));S.t=0;S.T=(N()>=6?1:2)*N();sdNext()}
 if(g==='qb'){S.r=0;QPool=[...QP].sort(()=>Math.random()-.5);qNext()}
 bcast()}
function dpTasks(){S.done={};S.p.forEach((p,k)=>send(p.id,{t:'task',r:S.r,k:S.r%2?'i':'t',prev:S.r?B[(k+S.r)%N()][S.r-1]:null}))}
function dpAdv(){S.r++;if(S.r>=N()){S.ph='rev';S.books=B;S.i=0;S.j=1}else dpTasks();bcast()}
function sdNext(){S.t++;S.ph='go';S.v={};S.out=null;S.who=OR[(S.t-1)%N()];S.lv=1+Math.floor((S.t-1)*6/S.T);if(!SP[S.lv-1].length)SP[S.lv-1]=[...SD[S.lv-1]].sort(()=>Math.random()-.5);S.d=SP[S.lv-1].pop()}
function sdFin(ok,why,y,n){const p=S.p.find(p=>p.id===S.who),pts=ok?S.lv:-1;if(p)p.s+=pts;S.out={ok,why,y:y||0,n:n||0,pts};S.ph='res';bcast()}
function sdVote(){const v=Object.values(S.v),y=v.filter(x=>x).length,n=v.length-y;sdFin(y>=n,'vote',y,n)}
function qNext(){S.r++;S.ph='ans';S.q=QPool.pop();S.dn=[];S.v={};QA={}}
function qVote(){QO=Object.keys(QA).map(k=>({by:k,t:QA[k]})).sort(()=>Math.random()-.5);S.o=QO.map(x=>x.t);S.ph='vote';S.v={};bcast()}
function qRes(){S.res=QO.map((x,i)=>({t:x.t,by:x.by,vs:Object.keys(S.v).filter(v=>S.v[v]===i)}));S.res.forEach(x=>{const p=S.p.find(p=>p.id===x.by);if(p)p.s+=x.vs.length});S.ph='res';bcast()}
function mlNext(){S.ph='vote';S.v={};S.r++;S.q=Q[Math.random()*Q.length|0]}
function mlRes(){const c=tal(),mx=Math.max(...Object.values(c));S.p.forEach(p=>{if(c[p.id]===mx)p.s++});S.ph='res';bcast()}
function imNew(){S.g='im';S.ph='talk';S.v={};const w=WD[Math.random()*WD.length|0],bad=S.p[Math.random()*N()|0].id;S.st=S.p[Math.random()*N()|0].n;IM={bad,w};S.p.forEach(p=>send(p.id,{t:'word',w:p.id===bad?null:w}))}
function imRes(){const c=tal(),mx=Math.max(...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===mx),caught=top.length===1&&top[0]===IM.bad;
 S.p.forEach(p=>{if(caught&&p.id!==IM.bad)p.s++;if(!caught&&p.id===IM.bad)p.s+=2});S.bad=IM.bad;S.w=IM.w;S.caught=caught;S.ph='res';bcast()}

/* ---------- views ---------- */
function vSign(){return `<h1>Hop In 🎈</h1><p>Party games for you and your mates. Free, and there’s no app to download.</p><div class=card><h3>Who are you?</h3><input id=nm maxlength=12 placeholder="Your name" value="${esc(tmp.n)}"><div class=row style="margin:8px 0">${EM.map(e=>`<button class="e ${e===tmp.e?'on':''}" data-a=em data-e="${e}">${e}</button>`).join('')}</div><button class=r data-a=signin>Right, let’s go</button></div>`}
function vHome(){return `<h1>Hop In 🎈</h1>`+(peer?'<p>Connecting…</p>':`<div class=card>${chip(me)}<button data-a=out style="width:auto;display:inline-block;padding:3px 10px;font-size:14px;box-shadow:none">not you?</button><button class=r data-a=host>Start a room</button><h3>Got a code?</h3><input id=cd maxlength=4 value="${esc(Q0)}" placeholder="CODE" style="text-align:center;letter-spacing:8px;text-transform:uppercase"><button class=t data-a=join>Join</button></div>`+(err?`<div class=card>${esc(err)}</div>`:''))}
function vLobby(){return `<h2>Room ${S.c}</h2><div class=card style="text-align:center"><div class=big>${S.c}</div><div id=qr style="display:inline-block;padding:8px;background:#fff;margin-top:10px"></div><br><small>Scan this, or type the code in at ${esc(location.host)}</small></div><div class=card><h3>Players (${N()})</h3>${S.p.map(chip).join('')}</div>`+
 (host?GM.map(g=>`<button data-a=go data-g=${g[0]} ${N()<3?'disabled':''}>${g[1]} ${g[2]}<br><small>${g[3]}</small></button>`).join('')+(N()<3?'<p><small>You need at least 3 people to start.</small></p>':''):'<p>The host is picking a game.</p>')}
const show=x=>x.k==='i'&&x.v?`<img class=d src="${x.v}">`:`<h3>${esc(x.v||'…')}</h3>`;
function vDp(){
 if(S.ph==='rev'){const b=S.books[S.i];return `<h2>Chain ${S.i+1} of ${N()}</h2>`+b.slice(0,S.j).map(x=>`<div class=card><span class=tag>${pName(x.by)}</span>${show(x)}</div>`).join('')+(host?`<button class=r data-a=nx>${S.j<b.length||S.i<N()-1?'Next':'Finish'}</button>`:'<p>The host is flicking through. Watch their screen.</p>')}
 if(!T||T.r!==S.r||T.done)return `<h2>Waiting on everyone</h2><div class=card>${S.p.map(p=>chip(p)+(S.done[p.id]?'✅':'✏️')).join('<br>')}</div>`+(host?'<button data-a=skip>Skip whoever’s stuck</button>':'');
 const w=T.k==='t';shown=T.r;
 return `<span class=tag>Step ${T.r+1} of ${N()}</span>`+(T.r===0?'<h2>Write something for the next person to draw</h2><p>The weirder the better.</p>':w?`<h2>What’s this meant to be?</h2><div class=card>${show(T.prev)}</div>`:`<h2>Draw this</h2><div class=card>${show(T.prev)}</div>`)+
 (w?`<input id=tx maxlength=80 placeholder="${T.r?'What do you see?':'a cat riding a shark'}"><button class=r data-a=sub>Done</button>`:`<canvas id=cv width=260 height=260></canvas><div class=sw>${COL.map(c=>`<b data-a=col data-c="${c}" style="background:${c}"></b>`).join('')}</div><button data-a=clr style="width:auto;display:inline-block">Clear</button><button class=r data-a=sub>Done</button>`)}
function vMl(){
 if(S.ph==='vote')return `<span class=tag>Round ${S.r} of 6</span><h2>Who’s most likely to…</h2><div class=card><h3>${S.q}</h3></div>`+(S.v[id]?`<p>Vote sent. ${Object.keys(S.v).length}/${N()} voted.</p>`:S.p.filter(p=>p.id!==id).map(p=>`<button data-a=vote data-i="${p.id}">${p.e} ${esc(p.n)}</button>`).join(''));
 return `<h2>…${S.q}</h2>`+vres()+(host?`<button class=r data-a=nx>${S.r>=6?'Finish':'Next'}</button>`:'')}
function vSd(){
 if(S.ph==='end'){const mx=Math.max(...S.p.map(p=>p.s));return `<h2>🏆 ${S.p.filter(p=>p.s===mx).map(p=>p.e+' '+esc(p.n)).join(' & ')}</h2><p>Won with ${mx} point${mx===1?'':'s'}.</p>`}
 const mine=S.who===id,w=pName(S.who),tg=`<span class=tag>Dare ${S.t} of ${S.T}: ${LV[S.lv-1]}</span>`,
 card=`<div class=card style="background:var(--pink);text-align:center"><span class=tag>${w}</span><h2>${esc(S.d)}</h2></div>`;
 if(S.ph==='go')return tg+card+(mine?`<p>That’s yours, and everyone knows what it is. Pull it off for +${S.lv}. Bottle it and you lose 1.</p><button data-a=sdd>✅ Done it</button><button data-a=sdc>🐔 I can’t</button>`:`<p>Watch ${w}. Did they actually do it?</p>`)+(host?'<button class=t data-a=ev>Time’s up, count it as a fail</button>':'')+'<p><small>Keep it safe: no climbing on stuff, no touching people, and stop if a teacher says so.</small></p>';
 if(S.ph==='vote')return tg+card+(mine?`<p>${N()-1} people are deciding if you did it.</p>`:id in S.v?`<p>Vote sent. ${Object.keys(S.v).length}/${N()-1} in.</p>`:`<p>Did ${w} actually do it?</p><button data-a=sv data-y="1">Yeah, they did</button><button data-a=sv data-y="0">Nope</button>`)+(host?'<button class=t data-a=ev>Count the votes now</button>':'');
 const o=S.out;return tg+card+`<h2>${o.ok?'They did it!':'Bottled it'}</h2><p>${o.why==='chicken'?'Chickened out.':o.why==='time'?'Ran out of time.':o.y+' said yes, '+o.n+' said no.'} <b>${o.pts>0?'+'+o.pts:o.pts}</b> for ${w}.</p>`+(host?`<button class=r data-a=nx>${S.t>=S.T?'Final scores':'Next dare'}</button>`:'')}
function vQb(){
 const tg=`<span class=tag>Round ${S.r} of 4</span>`;
 if(S.ph==='ans'){
  if(qd===S.r||S.dn.includes(id))return tg+`<h2>Waiting on the others</h2><div class=card><h3>${esc(S.q)}</h3>${S.dn.length}/${N()} answered</div>`+(host?'<button data-a=skip>Skip whoever’s stuck</button>':'');
  qs=S.r;return tg+`<h2>Make it funny</h2><div class=card><h3>${esc(S.q)}</h3></div><input id=qa maxlength=60 placeholder="Your answer"><button class=r data-a=qa>Done</button>`}
 if(S.ph==='vote')return tg+`<h2>Vote for the funniest</h2><div class=card><b>${esc(S.q)}</b></div>`+(id in S.v?`<p>Vote sent. ${Object.keys(S.v).length}/${N()} voted.</p>`:S.o.map((t,i)=>t===myA?'':`<button data-a=qv data-o="${i}">${esc(t)}</button>`).join(''));
 return `<h2>${esc(S.q)}</h2>`+[...S.res].sort((a,b)=>b.vs.length-a.vs.length).map(x=>`<div class=card style="margin:10px 0;padding:12px"><h3>${esc(x.t)}</h3><span class=tag>${pName(x.by)}</span> +${x.vs.length} ${x.vs.map(v=>(S.p.find(p=>p.id===v)||{e:''}).e).join('')}</div>`).join('')+(host?`<button class=r data-a=nx>${S.r>=4?'Finish':'Next'}</button>`:'')}
const vres=()=>{const c=tal();return S.p.map(p=>`<div class=card style="padding:10px;margin:10px 0"><b>${pName(p.id)}</b>: ${c[p.id]||0}<div class=bar style="width:${(c[p.id]||0)/N()*100}%"></div><small>${Object.keys(S.v).filter(v=>S.v[v]===p.id).map(pName).join(', ')||'nobody'}</small></div>`).join('')};
function vIm(){
 const sec=W?(W.w?`<div class=card style="text-align:center"><small>Your word. Don’t show anyone.</small><div class=big style="font-size:40px;letter-spacing:0">${esc(W.w)}</div></div>`:`<div class=card style="background:var(--pink);text-align:center"><h2>You’re the imposter 🕵️</h2><p>You don’t get a word. Bluff your way through.</p></div>`):'';
 if(S.ph==='talk')return sec+`<h2>Talk</h2><p><b>${esc(S.st)}</b> goes first. Go round the circle and say one word each that hints at the secret word. Don’t make it too obvious or the imposter will work it out.</p>`+(host?'<button class=r data-a=tv>Vote now</button>':'');
 if(S.ph==='vote')return sec+`<h2>Who’s the imposter?</h2>`+(S.v[id]?`<p>Vote sent. ${Object.keys(S.v).length}/${N()} voted.</p>`:S.p.filter(p=>p.id!==id).map(p=>`<button data-a=vote data-i="${p.id}">${p.e} ${esc(p.n)}</button>`).join(''));
 return `<h2>${S.caught?'Got them! 🎉':'The imposter got away with it 😈'}</h2><div class=card>Imposter: <b>${pName(S.bad)}</b><br>Word: <b>${esc(S.w)}</b></div>`+vres()+(host?'<button class=r data-a=nx>Another round</button>':'')}
const board=()=>S.g==='dp'?'':`<div class=card><h3>Scores</h3>${[...S.p].sort((a,b)=>b.s-a.s).map(p=>chip(p)+'<b>'+p.s+'</b>').join(' ')}</div>`;
const vGame=()=>({dp:vDp,ml:vMl,im:vIm,qb:vQb,sd:vSd}[S.g])()+board()+(host?'<button data-a=home>Back to lobby</button>':'');

function render(){
 if(shown>=0&&T&&!T.done&&shown===T.r&&T.r===S.r&&S.g==='dp'&&S.ph==='play')return;
 if(qs===S.r&&S.g==='qb'&&S.ph==='ans'&&qd!==S.r)return;
 shown=-1;qs=-1;
 $('#app').innerHTML=!me?vSign():!S.p.length?vHome():S.g?vGame():vLobby();
 if($('#qr')&&window.QRCode)new QRCode($('#qr'),{text:location.href.split(/[?#]/)[0]+'?room='+S.c,width:150,height:150});
 if($('#cv'))initCv();
}
function initCv(){
 const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,260,260);x.lineCap=x.lineJoin='round';let d=0,lx,ly;
 const P=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*260/r.width,(e.clientY-r.top)*260/r.height]};
 const ln=(a,b)=>{x.strokeStyle=col;x.lineWidth=col==='#fff'?20:5;x.beginPath();x.moveTo(lx,ly);x.lineTo(a+.01,b);x.stroke();lx=a;ly=b};
 c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);[lx,ly]=P(e);ln(lx,ly)};
 c.onpointermove=e=>{if(d){const[a,b]=P(e);ln(a,b)}};
 c.onpointerup=c.onpointercancel=()=>d=0;
}
const ready=()=>window.Peer?1:(alert('Give it a second, it’s still loading.'),0);
const A={
 em(d){tmp.n=$('#nm').value;tmp.e=d.e;render()},
 signin(){const n=$('#nm').value.trim();if(!n)return;me={n,e:tmp.e};try{localStorage.hop=JSON.stringify(me)}catch(e){}render();if(Q0&&ready()){join(Q0);render()}},
 out(){me=null;try{localStorage.removeItem('hop')}catch(e){}render()},
 host(){if(!ready())return;err='';startHost();render()},
 join(){const c=$('#cd').value.trim();if(c.length===4&&ready()){err='';join(c);render()}},
 go(d){act({t:'go',g:d.g})},home(){act({t:'home'})},nx(){act({t:'nx'})},skip(){act({t:'skip'})},tv(){act({t:'tv'})},
 vote(d){act({t:'vote',to:d.i})},
 col(d){col=d.c},
 qa(){const v=$('#qa').value.trim()||'(blank)';myA=v;qd=S.r;act({t:'qa',v});render()},
 qv(d){act({t:'qv',o:+d.o})},
 sdd(){act({t:'sdd'})},sdc(){act({t:'sdc'})},sv(d){act({t:'sv',y:+d.y})},ev(){act({t:'ev'})},
 clr(){const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,260,260)},
 sub(){const t=T;const v=t.k==='t'?($('#tx').value.trim()||'(blank)'):$('#cv').toDataURL('image/jpeg',.5);t.done=true;act({t:'sub',r:t.r,v});render()}
};
document.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)};
render();
window.addEventListener('load',()=>{if(me&&Q0&&!peer&&!S.p.length&&window.Peer){join(Q0);render()}});
